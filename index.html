<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bento Atmospheric Intelligence</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', 'Inter', 'sans-serif'] },
          colors: { background: '#000000', surface: 'rgba(28, 28, 30, 0.6)', surfaceHover: 'rgba(44, 44, 46, 0.8)', accent: '#9D7DFF' }
        }
      }
    }
  </script>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { background-color: #000000; color: #FFFFFF; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    
    /* Procedural Cloud Background Animation */
    .bg-animation {
      position: fixed; top: 0; left: 0; width: 200vw; height: 100vh; z-index: -1;
      background: radial-gradient(circle at 30% 50%, rgba(157, 125, 255, 0.05) 0%, transparent 40%),
                  radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.03) 0%, transparent 40%);
      animation: drift 60s linear infinite; filter: blur(60px);
    }
    @keyframes drift { 0% { transform: translateX(0); } 100% { transform: translateX(-50vw); } }

    /* Bento Grid Apple-Style Panels */
    .bento-panel {
      background: var(--tw-colors-surface); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 28px;
      transition: transform 0.2s ease, background 0.2s ease; cursor: pointer;
    }
    .bento-panel:hover { background: var(--tw-colors-surfaceHover); transform: scale(1.01); }
    .no-hover:hover { transform: none; cursor: default; background: var(--tw-colors-surface); }
    
    /* Scrollbars */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Custom Apple Scales */
    .gradient-scale { background: linear-gradient(to right, #4ADE80, #F59E0B, #EF4444, #9D7DFF); height: 4px; border-radius: 4px; position: relative; margin-top: 12px; }
    .scale-dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; background: white; border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.5); border: 2px solid #1C1C1E; }
    
    /* Radar Map Tweaks */
    #map { z-index: 1; border-radius: 20px; height: 100%; min-height: 250px; background-color: #1a1a1a; }
    .leaflet-control-attribution { display: none !important; }
    .layer-btn { font-size: 11px; padding: 4px 8px; border-radius: 12px; background: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px); }
    .layer-btn.active { background: #9D7DFF; color: black; border-color: #9D7DFF; }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
  
  <div class="bg-animation"></div>

  <div class="max-w-[1200px] mx-auto flex flex-col gap-4">
    
    <header class="flex justify-between items-center px-2 mb-2">
      <div class="relative w-64">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
        <input type="text" id="search-input" placeholder="Search Location..." class="w-full bg-white/10 border border-white/5 rounded-xl py-2 pl-9 pr-4 text-sm text-white focus:outline-none focus:bg-white/20 transition-all">
      </div>
      <div class="text-right">
        <p class="text-[10px] text-gray-500 uppercase font-semibold">Observation Station</p>
        <p class="text-xs text-gray-300">Hong Kong Observatory HQ • <span class="text-green-400">Synced</span></p>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      
      <div class="bento-panel col-span-1 lg:col-span-2 row-span-1 p-6 relative overflow-hidden flex flex-col justify-between" id="modal-trigger-hero">
        <div class="flex justify-between items-start z-10">
          <div>
            <h2 class="text-3xl font-semibold tracking-tight">Hong Kong</h2>
            <p class="text-gray-400 text-lg font-medium mt-1">Overcast</p>
          </div>
          <i data-lucide="cloud" class="w-12 h-12 text-white animate-pulse" style="animation-duration: 4s;"></i>
        </div>
        <div class="z-10 mt-8">
          <h1 class="text-7xl font-bold tracking-tighter" id="hero-temp">29°</h1>
          <p class="text-gray-400 text-sm font-medium mt-3 tracking-wide">Feels Like 33° <span class="mx-2">•</span> H:30° L:23°</p>
        </div>
      </div>

      <div class="bento-panel no-hover col-span-1 lg:col-span-2 row-span-1 p-2 h-[260px] relative">
        <div class="absolute top-4 right-4 z-[400] flex gap-2">
          <button class="layer-btn active">Precip</button>
          <button class="layer-btn">Temp</button>
          <button class="layer-btn">AQI</button>
        </div>
        <div id="map"></div>
      </div>

      <div class="bento-panel p-5 flex flex-col justify-between">
        <div class="flex items-center gap-2 text-gray-400 text-xs font-semibold uppercase tracking-wider"><i data-lucide="sun-dim" class="w-4 h-4"></i> UV Index</div>
        <div>
          <div class="text-3xl font-semibold">8.9</div>
          <div class="text-lg font-medium">Very High</div>
          <div class="gradient-scale"><div class="scale-dot" style="left: 80%;"></div></div>
        </div>
      </div>

      <div class="bento-panel p-5 flex flex-col justify-between">
        <div class="flex items-center gap-2 text-gray-400 text-xs font-semibold uppercase tracking-wider"><i data-lucide="wind" class="w-4 h-4"></i> Wind</div>
        <div class="relative h-24 w-full flex items-center justify-center">
           <div class="w-20 h-20 border-2 border-gray-600 rounded-full relative">
             <div class="absolute inset-0 flex items-center justify-center text-xs text-gray-500 font-medium">N</div>
             <div class="absolute top-0 bottom-0 left-1/2 w-0.5 bg-transparent transform -translate-x-1/2" style="transform: rotate(225deg);">
               <div class="w-2 h-2 bg-white rounded-full -ml-1"></div>
             </div>
           </div>
           <div class="absolute inset-0 flex flex-col items-center justify-center mt-2">
             <span class="text-xl font-bold">3.7</span>
             <span class="text-[10px] text-gray-400">m/s</span>
           </div>
        </div>
      </div>

      <div class="bento-panel p-5 flex flex-col justify-between">
        <div class="flex items-center gap-2 text-gray-400 text-xs font-semibold uppercase tracking-wider"><i data-lucide="leaf" class="w-4 h-4"></i> Air Quality</div>
        <div>
          <div class="text-3xl font-semibold">60</div>
          <div class="text-lg font-medium text-yellow-500">Moderate</div>
          <div class="gradient-scale"><div class="scale-dot" style="left: 40%;"></div></div>
        </div>
      </div>

      <div class="bento-panel p-5 flex flex-col justify-between">
        <div class="flex items-center gap-2 text-gray-400 text-xs font-semibold uppercase tracking-wider"><i data-lucide="droplets" class="w-4 h-4"></i> Humidity</div>
        <div>
          <div class="text-3xl font-semibold">82%</div>
          <div class="text-sm font-medium text-gray-400 mt-2">The dew point is 26° right now.</div>
        </div>
      </div>

      <div class="bento-panel no-hover col-span-1 lg:col-span-2 p-5 flex flex-col">
        <div class="flex items-center gap-2 text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2"><i data-lucide="clock" class="w-4 h-4"></i> 120-Min Precipitation</div>
        <div class="flex-1 w-full relative min-h-[120px]">
          <canvas id="nowcastChart"></canvas>
        </div>
      </div>

      <div class="bento-panel no-hover col-span-1 lg:col-span-2 p-5 flex flex-col">
        <div class="flex items-center gap-2 text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2"><i data-lucide="bar-chart-2" class="w-4 h-4"></i> 24-Hr Analytics</div>
        <div class="flex-1 w-full relative min-h-[120px]">
          <canvas id="analyticsChart"></canvas>
        </div>
      </div>

      <div class="bento-panel no-hover col-span-1 lg:col-span-4 p-5">
        <div class="flex items-center gap-2 text-gray-400 text-xs font-semibold uppercase tracking-wider mb-4"><i data-lucide="calendar-clock" class="w-4 h-4"></i> 24-Hour Micro Forecast</div>
        <div class="flex overflow-x-auto gap-2 pb-2 no-scrollbar border-b border-white/10" id="hourly-carousel">
          </div>
      </div>

      <div class="bento-panel no-hover col-span-1 lg:col-span-4 p-5 flex flex-col gap-3">
        <div class="flex items-center gap-2 text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2"><i data-lucide="calendar-days" class="w-4 h-4"></i> 9-Day Outlook</div>
        <div id="daily-forecast" class="flex flex-col gap-3">
          </div>
      </div>
      
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Map Init
    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([22.3193, 114.1694], 10);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 18 }).addTo(map);
    
    // Fetch Radar
    fetch('https://api.rainviewer.com/public/weather-maps.json').then(r => r.json()).then(data => {
      const past = data.radar.past;
      if(past.length) L.tileLayer(`https://tilecache.rainviewer.com${past[past.length-1].path}/256/{z}/{x}/{y}/2/1_1.png`, { opacity: 0.7, maxNativeZoom: 12, maxZoom: 18, errorTileUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=' }).addTo(map);
    });

    // Mock Data for UI Demonstration (Hook this to your Vercel API response)
    const mockHourly = Array.from({length: 24}, (_, i) => ({ time: `${String(i).padStart(2, '0')}:00`, temp: 28 + Math.sin(i/4)*3, precip: Math.random() > 0.7 ? 40 : 0 }));
    
    // 120-Min Nowcast Chart (Hyper-Precise Precipitation)
    const ctxNow = document.getElementById('nowcastChart').getContext('2d');
    const gradientNow = ctxNow.createLinearGradient(0, 0, 0, 120);
    gradientNow.addColorStop(0, 'rgba(157, 125, 255, 0.8)'); gradientNow.addColorStop(1, 'rgba(157, 125, 255, 0.1)');
    
    new Chart(ctxNow, {
      type: 'bar',
      data: {
        labels: Array.from({length: 12}, (_, i) => `+${i*10}m`),
        datasets: [{ data: [0, 0.2, 0.8, 1.5, 2.1, 1.8, 1.0, 0.5, 0.1, 0, 0, 0], backgroundColor: gradientNow, borderRadius: 4 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#8E8E93', font: {size: 10} } },
          y: { 
            grid: { color: 'rgba(255,255,255,0.05)' }, 
            ticks: { color: '#8E8E93', font: {size: 10}, callback: function(val) { return val === 2 ? 'Heavy' : val === 1 ? 'Medium' : val === 0 ? 'None' : ''; } },
            max: 3
          }
        }
      }
    });

    // Advanced Analytics Chart (Timestamp Fix)
    const ctxAn = document.getElementById('analyticsChart').getContext('2d');
    new Chart(ctxAn, {
      type: 'line',
      data: {
        labels: mockHourly.map(h => h.time),
        datasets: [{ data: mockHourly.map(h => h.temp), borderColor: '#9D7DFF', borderWidth: 3, pointRadius: 0, tension: 0.4 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8E8E93', maxTicksLimit: 6, font: {size: 11} } },
          y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8E8E93' } }
        }
      }
    });

    // Populate Micro Carousel
    document.getElementById('hourly-carousel').innerHTML = mockHourly.map(h => `
      <div class="flex flex-col items-center gap-2 min-w-[50px] pb-3">
        <span class="text-xs text-gray-300 font-medium">${h.time.split(':')[0]}</span>
        <i data-lucide="cloud" class="w-5 h-5 text-gray-400"></i>
        <span class="text-sm font-semibold">${Math.round(h.temp)}°</span>
      </div>
    `).join('');
    lucide.createIcons();

    // Populate 9-Day Gantt Chart
    const mockDaily = [
      {day: 'Today', icon: 'cloud-drizzle', low: 23, high: 30, absMin: 22, absMax: 34},
      {day: 'Thu', icon: 'cloud-lightning', low: 25, high: 31, absMin: 22, absMax: 34},
      {day: 'Fri', icon: 'cloud', low: 26, high: 33, absMin: 22, absMax: 34},
      {day: 'Sat', icon: 'sun', low: 27, high: 34, absMin: 22, absMax: 34}
    ];

    document.getElementById('daily-forecast').innerHTML = mockDaily.map(d => {
      // Calculate CSS percentages for the Gantt bar spread
      const totalRange = d.absMax - d.absMin;
      const leftMargin = ((d.low - d.absMin) / totalRange) * 100;
      const barWidth = ((d.high - d.low) / totalRange) * 100;
      
      // Dynamic gradient based on temp
      const grad = d.high > 32 ? 'from-orange-400 to-red-500' : 'from-blue-400 to-yellow-400';

      return `
      <div class="flex items-center gap-4 text-sm font-medium">
        <span class="w-10 text-gray-300">${d.day}</span>
        <i data-lucide="${d.icon}" class="w-5 h-5 text-gray-400"></i>
        <span class="w-6 text-right text-gray-400">${d.low}°</span>
        <div class="flex-1 h-1.5 bg-white/10 rounded-full relative">
          <div class="absolute h-full rounded-full bg-gradient-to-r ${grad}" style="left: ${leftMargin}%; width: ${barWidth}%;"></div>
        </div>
        <span class="w-6 text-right font-semibold">${d.high}°</span>
      </div>`;
    }).join('');
    lucide.createIcons();
  </script>
</body>
</html>
